name: Rename demo to index

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rename demo file to index.html
        run: |
          mv demo-web-isamabi.html index.html
          rm .github/workflows/rename-to-index.yml
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Rename demo-web-isamabi.html to index.html (final official version with assistant redirecting personal questions to WhatsApp)"
          git push
