name: Rename demo to index
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rename demo file to index.html
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git mv demo-web-isamabi.html index.html
          git rm .github/workflows/rename-to-index.yml
          git status --short
          git commit -m "Rename demo-web-isamabi.html to index.html (final version with videos)"
          git push origin main
